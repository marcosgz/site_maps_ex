version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: mix
    directory: /
    schedule:
      interval: weekly
    groups:
      mix:
        update-types: [minor, patch]

  - package-ecosystem: mix
    directory: /examples/two_tenants
    schedule:
      interval: weekly
    groups:
      example-mix:
        update-types: [minor, patch]

  - package-ecosystem: mix
    directory: /examples/single_site
    schedule:
      interval: weekly
    groups:
      example-single-site-mix:
        update-types: [minor, patch]
